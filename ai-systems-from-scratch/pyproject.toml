[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-systems-from-scratch"
version = "1.0.0"
description = "Modern AI Systems Engineering from first principles: compilers, kernels, inference, fine-tuning, agents, evals, and production reliability."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "AI Systems Engineering Course Authors" }
]
dependencies = [
    "torch>=2.2.0",
    "numpy>=1.26.0",
    "pydantic>=2.5.0",
    "pytest>=8.0.0",
    "transformers>=4.40.0",
    "peft>=0.10.0",
    "trl>=0.8.0",
    "accelerate>=0.30.0",
    "datasets>=2.18.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
gpu = [
    "triton>=2.2.0; sys_platform == 'linux'",
    "vllm>=0.4.0; sys_platform == 'linux'",
]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
]

[tool.pytest.ini_options]
testpaths = ["evaluation", "broken-systems", "compiler-labs", "kernels", "training", "inference", "agents", "tools", "projects"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"
