AWSTemplateFormatVersion: '2010-09-09'
Description: >
  aws-from-scratch: Serverless API Architecture.
  Provisions an HTTP API Gateway, Lambda function, and DynamoDB table with least-privilege IAM.
  Zero idle cost ($0.00/month when zero requests are made).

Parameters:
  ProjectName:
    Type: String
    Default: aws-from-scratch
  Environment:
    Type: String
    Default: learning

Resources:
  # ---------------------------------------------------------------------------
  # DynamoDB Table (Pay-Per-Request / On-Demand: Zero idle capacity cost)
  # ---------------------------------------------------------------------------
  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-orders'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # ---------------------------------------------------------------------------
  # IAM Execution Role for Lambda
  # ---------------------------------------------------------------------------
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-orders-lambda-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: DynamoDBScopedAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                Resource: !GetAtt OrdersTable.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectName}*'

  # ---------------------------------------------------------------------------
  # Lambda Function
  # ---------------------------------------------------------------------------
  OrdersFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-orders-handler'
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      MemorySize: 256
      Timeout: 5
      Environment:
        Variables:
          TABLE_NAME: !Ref OrdersTable
      Code:
        ZipFile: |
          import json
          import os
          import boto3

          dynamodb = boto3.resource('dynamodb')
          table = dynamodb.Table(os.environ['TABLE_NAME'])

          def lambda_handler(event, context):
              http_method = event.get('httpMethod', 'GET')
              if http_method == 'GET':
                  return {
                      'statusCode': 200,
                      'headers': {'Content-Type': 'application/json'},
                      'body': json.dumps({'status': 'healthy', 'service': 'aws-from-scratch-api'})
                  }
              return {
                  'statusCode': 400,
                  'headers': {'Content-Type': 'application/json'},
                  'body': json.dumps({'error': 'Unsupported method'})
              }
      Tags:
        - Key: Project
          Value: !Ref ProjectName

Outputs:
  DynamoDBTableName:
    Value: !Ref OrdersTable
  LambdaFunctionArn:
    Value: !GetAtt OrdersFunction.Arn
