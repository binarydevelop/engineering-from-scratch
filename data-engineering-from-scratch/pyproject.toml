[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "data-engineering-from-scratch"
version = "1.0.0"
description = "Understand it. Ingest it. Model it. Transform it. Validate it. Break it. Recover it. Scale it. Operate it."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Data Engineering From Scratch Team" }
]
dependencies = [
    "duckdb>=1.1.0",
    "pyarrow>=17.0.0",
    "pydantic>=2.8.0",
    "sqlparse>=0.5.0",
    "tabulate>=0.9.0",
    "python-dotenv>=1.0.1",
    "pytest>=8.3.0",
    "rich>=13.8.0",
]

[tool.pytest.ini_options]
testpaths = ["phases", "projects", "broken-pipelines", "exercises"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --import-mode=importlib"
filterwarnings = [
    "ignore::DeprecationWarning",
]
