services:
  postgres:
    image: postgres:16-alpine
    container_name: capstone-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-capstone_secret}
      POSTGRES_DB: ${POSTGRES_DB:-system_lab}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend-tier
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s

  redis:
    image: redis:7-alpine
    container_name: capstone-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - backend-tier
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 1s

  nats:
    image: nats:2.10-alpine
    container_name: capstone-nats
    restart: unless-stopped
    command: -m 8222
    networks:
      - backend-tier

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: capstone-app:latest
    container_name: capstone-app
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    networks:
      - frontend-tier
      - backend-tier
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: capstone-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - frontend-tier
    depends_on:
      app:
        condition: service_healthy

  grafana:
    image: grafana/grafana:10.4.0
    container_name: capstone-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: ${GF_USERS_ALLOW_SIGN_UP:-false}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - frontend-tier
    depends_on:
      prometheus:
        condition: service_started

networks:
  frontend-tier:
    driver: bridge
  backend-tier:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
