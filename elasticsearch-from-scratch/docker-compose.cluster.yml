services:
  es01:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: es-cluster-01
    environment:
      - node.name=es01
      - cluster.name=es-scratch-cluster
      - discovery.seed_hosts=es02,es03
      - cluster.initial_master_nodes=es01,es02,es03
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - path.repo=/usr/share/elasticsearch/snapshots
    ports:
      - "9200:9200"
      - "9300:9300"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - esdata_cluster_01:/usr/share/elasticsearch/data
      - es_cluster_snapshots:/usr/share/elasticsearch/snapshots
    networks:
      - esnet

  es02:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: es-cluster-02
    environment:
      - node.name=es02
      - cluster.name=es-scratch-cluster
      - discovery.seed_hosts=es01,es03
      - cluster.initial_master_nodes=es01,es02,es03
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - path.repo=/usr/share/elasticsearch/snapshots
    ports:
      - "9201:9200"
      - "9301:9300"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - esdata_cluster_02:/usr/share/elasticsearch/data
      - es_cluster_snapshots:/usr/share/elasticsearch/snapshots
    networks:
      - esnet

  es03:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: es-cluster-03
    environment:
      - node.name=es03
      - cluster.name=es-scratch-cluster
      - discovery.seed_hosts=es01,es02
      - cluster.initial_master_nodes=es01,es02,es03
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - path.repo=/usr/share/elasticsearch/snapshots
    ports:
      - "9202:9200"
      - "9302:9300"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - esdata_cluster_03:/usr/share/elasticsearch/data
      - es_cluster_snapshots:/usr/share/elasticsearch/snapshots
    networks:
      - esnet

networks:
  esnet:
    driver: bridge

volumes:
  esdata_cluster_01:
    driver: local
  esdata_cluster_02:
    driver: local
  esdata_cluster_03:
    driver: local
  es_cluster_snapshots:
    driver: local
