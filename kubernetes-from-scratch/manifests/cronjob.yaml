apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly-cleanup
  namespace: default
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: cleaner
            image: busybox:1.36
            command: ["sh", "-c", "echo 'Pruning expired cache tokens...'; sleep 3; echo 'Cleanup done.'"]
            resources:
              requests:
                cpu: "20m"
                memory: "32Mi"
              limits:
                cpu: "50m"
                memory: "64Mi"
