apiVersion: batch/v1
kind: Job
metadata:
  name: db-migration
  namespace: default
spec:
  backoffLimit: 3
  completions: 1
  template:
    metadata:
      labels:
        job: db-migration
    spec:
      restartPolicy: OnFailure
      containers:
      - name: migrator
        image: busybox:1.36
        command: ["sh", "-c", "echo 'Applying database migrations...'; sleep 5; echo 'Schema updated successfully.'; exit 0"]
        resources:
          requests:
            cpu: "50m"
            memory: "32Mi"
          limits:
            cpu: "100m"
            memory: "64Mi"
