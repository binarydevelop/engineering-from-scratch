apiVersion: v1
kind: Service
metadata:
  name: vault-internal
  namespace: default
  labels:
    app: vault
spec:
  clusterIP: None # Headless Service
  selector:
    app: vault
  ports:
  - port: 6379
    name: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vault
  namespace: default
spec:
  serviceName: vault-internal
  replicas: 3
  podManagementPolicy: OrderedReady # Enforces strict ordinal 0 -> 1 -> 2 initialization
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
    spec:
      containers:
      - name: store
        image: redis:7.4-alpine
        ports:
        - containerPort: 6379
          name: redis
        volumeMounts:
        - name: data
          mountPath: /data
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "100m"
            memory: "128Mi"
        readinessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 2
          periodSeconds: 5
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: standard
      resources:
        requests:
          storage: 500Mi
