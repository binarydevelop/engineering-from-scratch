apiVersion: v1
kind: Namespace
metadata:
  name: ecommerce-web
---
apiVersion: v1
kind: Namespace
metadata:
  name: ecommerce-data
---
# Data Tier: Redis
apiVersion: v1
kind: Service
metadata:
  name: redis-svc
  namespace: ecommerce-data
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-cache
  namespace: ecommerce-data
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7.4-alpine
        ports:
        - containerPort: 6379
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "100m"
            memory: "128Mi"
---
# Web Tier: API Backend
apiVersion: v1
kind: Service
metadata:
  name: api-svc
  namespace: ecommerce-web
spec:
  type: ClusterIP
  selector:
    app: api-backend
  ports:
  - port: 8080
    targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-backend
  namespace: ecommerce-web
  labels:
    app: api-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-backend
  template:
    metadata:
      labels:
        app: api-backend
    spec:
      containers:
      - name: api
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80
        env:
        # Cross-namespace FQDN DNS discovery:
        - name: REDIS_URL
          value: "redis-svc.ecommerce-data.svc.cluster.local:6379"
        resources:
          requests:
            cpu: "50m"
            memory: "32Mi"
          limits:
            cpu: "100m"
            memory: "64Mi"
---
# Web Tier: Frontend UI
apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  namespace: ecommerce-web
spec:
  type: ClusterIP
  selector:
    app: frontend-ui
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-ui
  namespace: ecommerce-web
  labels:
    app: frontend-ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend-ui
  template:
    metadata:
      labels:
        app: frontend-ui
    spec:
      containers:
      - name: ui
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80
        env:
        - name: API_URL
          value: "http://api-svc:8080"
        resources:
          requests:
            cpu: "50m"
            memory: "32Mi"
          limits:
            cpu: "100m"
            memory: "64Mi"
