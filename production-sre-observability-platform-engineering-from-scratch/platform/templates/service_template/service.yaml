apiVersion: platform.internal/v1alpha1
kind: Service
metadata:
  name: {{service_name}}
  team: {{team_name}}
  tier: 1
spec:
  port: {{port}}
  resources:
    cpu_limit: "500m"
    memory_limit: "512Mi"
  probes:
    liveness: "/healthz"
    readiness: "/ready"
  telemetry:
    enabled: true
    protocol: otlp
