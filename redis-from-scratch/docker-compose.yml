services:
  # Standalone / Primary Redis Server (Phases 00 - 50)
  redis-primary:
    image: redis:7-alpine
    container_name: redis-primary
    ports:
      - "6379:6379"
    command: ["redis-server", "--protected-mode", "no", "--save", "60", "1", "--loglevel", "notice"]
    volumes:
      - redis_primary_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 5

  # Redis Replica Server (Phases 34 - 36)
  redis-replica:
    image: redis:7-alpine
    container_name: redis-replica
    ports:
      - "6380:6379"
    command: ["redis-server", "--protected-mode", "no", "--replicaof", "redis-primary", "6379", "--loglevel", "notice"]
    depends_on:
      redis-primary:
        condition: service_healthy
    volumes:
      - redis_replica_data:/data

  # PostgreSQL for Cache Comparison Labs (Phases 01, 22, 42)
  postgres:
    image: postgres:16-alpine
    container_name: redis-lab-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: redis_lab
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  redis_primary_data:
  redis_replica_data:
  postgres_data:
