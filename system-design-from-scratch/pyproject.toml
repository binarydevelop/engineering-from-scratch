[project]
name = "system-design-from-scratch"
version = "1.0.0"
description = "A first-principles, empirical curriculum for mastering distributed systems and system design."
authors = [{ name = "Rohit Ghumare", email = "rohit@example.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "anyio>=4.3.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "cryptography>=42.0.0",
    "pyjwt>=2.8.0",
    "python-dotenv>=1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["phases", "simulations", "broken-systems", "projects", "interview-problems"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --import-mode=importlib"
